tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContact
description: Delete a contact using its ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 665bce5fe8f82d4adf4bfa1b
responses:
  '204':
    description: Contact deleted successfully
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
