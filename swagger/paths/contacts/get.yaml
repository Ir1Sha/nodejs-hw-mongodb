tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: Retrieve a paginated list of user's contacts with optional filters
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    schema:
      type: integer
    example: 10
    description: Number of items per page
  - in: query
    name: isFavourite
    schema:
      type: boolean
    example: true
    description: Filter by favourite status
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    example: personal
    description: Filter by contact type
  - in: query
    name: sortBy
    schema:
      type: string
    example: name
    description: Field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
    example: asc
    description: Sort order
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts
            data:
              type: object
              required:
                - contacts
                - page
                - limit
                - totalItems
                - totalPages
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 42
                totalPages:
                  type: integer
                  example: 5
  '401':
    $ref: '../../components/responses/401.yaml'
